function vAjuda(){return `<h1>Ajuda</h1><div class="panel" style="line-height:1.7">
 <h3 style="margin-top:0">Como os cálculos são salvos</h3><p>No primeiro cálculo de um processo, informe o autor, o réu e o número do processo. Se o processo foi distribuído para cumprimento de sentença e ainda não tem número, marque <b>Distribuído sem número</b>. Nas próximas atualizações desse cálculo, o número do processo passa a ser obrigatório. Para encontrar um cálculo depois, basta digitar o nome do autor, do réu ou o número do processo.</p>
 <h3>Tabelas dos tribunais</h3><p>Escolha a tabela do tribunal do processo: TJSC, TJSP, TJRS, TJPR, TJMG, TJDFT, demais Tribunais de Justiça pelo INPC ou pelo IPCA-E, Fazenda Pública (Tema 810 e EC 113/2021), benefícios previdenciários (Manual do CJF) e Justiça do Trabalho (ADC 58). Para Santa Catarina, a tabela oficial usa os índices da Contadoria Judicial do TJSC (ICGJ): INPC até 29/08/2024 e IPCA a partir de 30/08/2024, com os meses de deflação aplicados, como na tabela do Tribunal. Se a decisão mandar usar o INPC no período todo, escolha "TJSC com INPC sem a troca de 2024". Nas demais tabelas, se a decisão mandar aplicar o IPCA a partir de 30/08/2024 (Lei 14.905/2024), marque a caixa própria nos critérios. O critério usado aparece no relatório. Os índices são atualizados automaticamente a cada cálculo, direto do Banco Central.</p><h3>Cálculo individual ou por parcelas</h3><p>No cálculo jurídico, o modo individual serve para um ou poucos valores. O modo por parcelas gera aluguéis, prestações ou pensões mês a mês: informe o valor, a quantidade e o primeiro vencimento, e cada parcela é corrigida a partir do próprio vencimento.</p><h3>De onde vêm os índices</h3><p>IPCA, IPCA-E, INPC, IGP-M e Selic são buscados no Banco Central (sistema SGS) no momento do cálculo. A correção usa os índices do mês da data do valor até o mês anterior à data do cálculo. Quando um índice ainda não foi divulgado, o cálculo usa o último disponível e avisa no relatório.</p>
 <h3>Juros</h3><p>Juros legais por período aplicam 0,5% ao mês até 10/01/2003, 1% ao mês até 29/08/2024 e a taxa legal depois. Nos meses em que a tabela usa a Selic, não há juros separados, porque a Selic já inclui juros. 1% ou 0,5% ao mês são juros simples, contados por dia (mês de 30 dias). Selic acumulada segue a regra da Receita Federal: soma das taxas mensais a partir do mês seguinte, mais 1% no mês do cálculo. A taxa legal da Lei 14.905/2024 é a Selic menos o IPCA de cada mês, nunca negativa.</p>
 <h3>Liquidação de sentença</h3><p>Cada verba tem o seu tipo, o termo inicial da correção e, se a decisão fixar, o termo inicial dos juros. Danos morais: correção desde o arbitramento (Súmula 362 do STJ) e juros desde o evento danoso (Súmula 54 do STJ) ou desde a citação. Danos materiais: correção desde o prejuízo (Súmula 43 do STJ). Custas: somente correção. Honorários fixados em valor: juros desde o trânsito em julgado (art. 85, §16, do CPC). Repetição de indébito pode ser calculada em dobro (art. 42, parágrafo único, do CDC). Pagamentos e depósitos do devedor são atualizados e abatidos antes da multa e dos honorários do art. 523, que incidem só sobre o saldo (art. 523, §2º, do CPC). A multa diária (astreintes) é somada ao débito, respeitando o limite fixado. Os honorários de sucumbência podem ser calculados sobre a condenação ou sobre o valor da causa atualizado. Nos meses em que a tabela usa a Selic, ela já inclui correção e juros, então não há juros separados.</p>
 <h3>Configurações e voucher</h3><p>Em Configurações você vê a situação da assinatura, usa um voucher, troca a senha, informa os dados do escritório que saem no relatório e escolhe a tabela, os juros e os honorários padrão dos cálculos novos.</p>
 <h3>Todos os tipos de juros</h3><p>Juros de mora: juros legais por período, 1% ao mês simples ou capitalizado, 0,5% ao mês, 6% ou 12% ao ano, Selic acumulada (soma simples) ou capitalizada, taxa legal da Lei 14.905/2024, juros da poupança da Fazenda Pública ou <b>taxa livre</b>, em que o advogado informa qualquer percentual, ao mês ou ao ano, simples ou compostos. Juros compensatórios (remuneratórios): taxa livre, simples ou compostos, com período próprio, calculados em separado e, se marcado, com juros de mora também sobre eles (Súmula 102 do STJ). Juros simples são proporcionais aos dias (mês de 30 dias e ano de 365 dias). Juros compostos usam a fórmula (1 + taxa) elevado ao número de períodos, também proporcional aos dias. A capitalização só é permitida quando a lei, o contrato ou a decisão autorizar (Súmula 121 do STF, Súmula 539 do STJ e art. 591 do CC).</p>
 <h3>Cálculo tributário</h3><p>O débito federal segue a regra do Sicalc: juros pela Selic e multa de mora de 0,33% por dia de atraso, limitada a 20%. A simulação de IBS e CBS usa as alíquotas que você informar; para 2026, o ano de teste, as alíquotas são CBS 0,9% e IBS 0,1%. Para conferência oficial, use o Sicalc da Receita Federal e o Portal da Tributação sobre o Consumo.</p>
 <p class="notice">O Lex Calc é uma ferramenta de apoio. Confira os critérios da decisão judicial e da legislação aplicável ao caso antes de apresentar o cálculo.</p></div>`}

async function gerarComp(btn){const d=U.calc.dados;
 const vv=id=>{const e=$(id);return e?e.value:''};
 const g={ini:vv('#gIni'),fim:vv('#gFim'),devModo:vv('#gDM'),devValor:vv('#gDV'),recModo:vv('#gRM'),recValor:vv('#gRV'),reajuste:vv('#gRJ'),decimo:$('#gD13').checked};
 if(!g.ini||!g.fim||g.fim<g.ini){toast('Informe a primeira e a última competência, nessa ordem.');return}
 if((g.devModo!=='minimo'&&!num(g.devValor))||(g.recModo!=='nenhum'&&g.recModo!=='minimo'&&!num(g.recValor))){toast('Informe o valor em reais.');return}
 btn.disabled=true;btn.textContent='Gerando...';
 try{const M=mesesEntre(g.ini,g.fim);
  const sm=(g.devModo==='minimo'||g.recModo==='minimo'||g.reajuste==='minimo')?await serie('minimo'):null;
  const ip=(g.reajuste==='inpc'&&(g.devModo==='reaj'||g.recModo==='reaj'))?await serie('inpc'):null;
  const fatorAno={};const anoIni=+g.ini.slice(0,4);
  const fatorDe=a=>{if(a<=anoIni)return 1;if(fatorAno[a]!=null)return fatorAno[a];let f=fatorDe(a-1);
   if(g.reajuste==='minimo'){const ant=sm[(a-1)+'-01'],at=sm[a+'-01'];f=ant&&at?fatorDe(a-1)*(at/ant):f}
   else{let acum=1;for(let m=1;m<=12;m++){const k=(a-1)+'-'+String(m).padStart(2,'0');if(ip&&ip[k]!=null)acum*=1+ip[k]/100}f=fatorDe(a-1)*acum}
   return fatorAno[a]=f};
  const valorDe=(modo,base,mes)=>{if(modo==='nenhum')return 0;if(modo==='minimo')return sm[mes]!=null?sm[mes]:0;if(modo==='fixo')return num(base);return num(base)*fatorDe(+mes.slice(0,4))};
  const linhas=[];const porAno={};
  M.forEach(mes=>{const dev=valorDe(g.devModo,g.devValor,mes),rec=valorDe(g.recModo,g.recValor,mes);const dif=Math.round((dev-rec)*100)/100;
   if(dif>0.004){linhas.push({data:mes+'-01',valor:String(dif).replace('.',','),desc:'Competência '+mes.slice(5)+'/'+mes.slice(0,4)+(rec?' (devido '+R(dev)+' menos pago '+R(rec)+')':''),tipo:'ben'});
    const a=mes.slice(0,4);porAno[a]=porAno[a]||{n:0,ult:0,ultMes:mes};porAno[a].n++;porAno[a].ult=dif;porAno[a].ultMes=mes}});
  if(g.decimo)Object.keys(porAno).sort().forEach(a=>{const x=porAno[a];const v13=Math.round(x.ult*x.n/12*100)/100;
   const dt=(a+'-12')<=g.fim?a+'-12-01':x.ultMes+'-01';
   if(v13>0.004)linhas.push({data:dt,valor:String(v13).replace('.',','),desc:'Gratificação natalina de '+a+' ('+x.n+'/12)',tipo:'ben'})});
  if(!linhas.length){toast('Não houve diferença a receber no período informado.');btn.disabled=false;btn.textContent='Gerar as parcelas';return}
  linhas.sort((a,b)=>a.data.localeCompare(b.data));
  d.comp=g;d.lanc=linhas;d.nMeses=M.length;
  document.querySelectorAll('.modal').forEach(x=>x.remove());render();
  toast(linhas.length+' parcelas geradas, de '+MESNOME[+g.ini.slice(5)-1]+' de '+g.ini.slice(0,4)+' a '+MESNOME[+g.fim.slice(5)-1]+' de '+g.fim.slice(0,4))}
 catch(e){toast(e.message||'Não foi possível gerar as parcelas.');btn.disabled=false;btn.textContent='Gerar as parcelas'}}

function docOk(v){const d=String(v).replace(/\D/g,'');const dv=(b,p)=>{let s=0;for(let i=0;i<b.length;i++)s+=+b[i]*p[i];const r=s%11;return r<2?0:11-r};
 if(d.length===11){if(/^(\d)\1+$/.test(d))return false;const p1=[10,9,8,7,6,5,4,3,2],p2=[11,10,9,8,7,6,5,4,3,2];return dv(d.slice(0,9),p1)==d[9]&&dv(d.slice(0,10),p2)==d[10]}
 if(d.length===14){if(/^(\d)\1+$/.test(d))return false;const p1=[5,4,3,2,9,8,7,6,5,4,3,2],p2=[6,5,4,3,2,9,8,7,6,5,4,3,2];return dv(d.slice(0,12),p1)==d[12]&&dv(d.slice(0,13),p2)==d[13]}return false}

/* Todo escritório entra com usuário próprio no domínio do Lex Calc, para os dados
   de um escritório nunca ficarem pendurados na conta pessoal de ninguém. */
const LEX_DOM='lexcalc.app.br';
function lexUsuario(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9._-]/g,'').slice(0,40)}
function sugUsuario(){const e=$('#lEsc'),u=$('#lUsr');if(!e||!u)return;U.lesc=e.value;
 if(u.dataset.tocado)return;
 const base=lexUsuario(e.value.replace(/\b(advogados?|associados?|advocacia|sociedade|escrit[o\u00f3]rio|e|de|da|do|dos|das)\b/gi,'').replace(/\s+/g,''));
 u.value=base;U.lusr=base}
function lexLogin(v){const t=String(v||'').trim();return t.indexOf('@')>0?t:(lexUsuario(t)+'@'+LEX_DOM)}
async function entrar(){const email=lexLogin($('#lEm').value),password=$('#lSen').value;U.lemail=email;const {error}=await SB.auth.signInWithPassword({email,password});if(error){toast(/confirm/i.test(error.message)?'Confirme o e-mail antes de entrar.':'Usuário ou senha incorretos.');return}}
async function criar(){
 const nome=($('#lEsc')&&$('#lEsc').value||'').trim();
 const codigo=(($('#lCod2')&&$('#lCod2').value)||'').trim().toUpperCase();
 const usr=lexUsuario($('#lUsr')&&$('#lUsr').value);
 const password=($('#lSen')&&$('#lSen').value)||'';
 const contato=($('#lCont')&&$('#lCont').value||'').trim();
 U.lesc=nome;U.lusr=usr;U.lcont=contato;U.lcodigo=codigo;
 if(U.lconv){if(codigo.length<6){toast('Digite o código do convite por inteiro.');return}}
 else if(nome.length<3){toast('Escreva o nome do escritório.');return}
 if(usr.length<3){toast('Escreva o usuário do escritório, com pelo menos três letras.');return}
 if(password.length<8){toast('A senha precisa ter pelo menos 8 caracteres.');return}
 if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(contato)){toast('Escreva o e-mail de contato do responsável.');return}
 const email=usr+'@'+LEX_DOM;U.lemail=email;
 const extra=U.lconv?{convite:codigo}:{escritorio:nome};
 const {data,error}=await SB.auth.signUp({email,password,options:{data:Object.assign({app:'lexcalc',contato},extra)}});
 if(error){toast(/already|registered|exists/i.test(error.message)?'Já existe um escritório com esse usuário. Escolha outro.':error.message);return}
 window.BSC&&BSC.evento('cadastro','lexcalc');
 try{localStorage.setItem(U.lconv?'lm_convite':'lm_novo_esc',U.lconv?codigo:nome)}catch(e){}
 if(data.session){toast(U.lconv?'Acesso criado. Entrando no escritório...':'Escritório '+nome+' criado.');return}
 U.lmodo='codigo';U.lrec=0;render()}
async function recuperar(){const email=$('#lEm').value.trim();U.lemail=email;const {error}=await SB.auth.resetPasswordForEmail(email);if(error){toast(error.message);return}U.lmodo='codigo';U.lrec=1;render()}
async function confirmar(){const token=$('#lCod').value.trim();const {error}=await SB.auth.verifyOtp({email:U.lemail,token,type:U.lrec?'recovery':'signup'});if(error){toast('Código inválido ou vencido.');return}
 if(U.lrec){const {error:e2}=await SB.auth.updateUser({password:$('#lSen').value});if(e2){toast(e2.message);return}toast('Senha alterada')}U.lmodo='entrar';U.lrec=0}
async function sair(){await SB.auth.signOut()}
/* O Supabase trava se outra chamada a ele for feita dentro deste aviso: o trabalho roda logo depois, fora dele */
SB.auth.onAuthStateChange((ev,sess)=>{const u=sess?sess.user:null;const mudou=(u&&u.id)!==(U.user&&U.user.id);U.user=u;if(!mudou&&ev!=='SIGNED_OUT')return;
 setTimeout(async()=>{try{if(u){await checarAssinatura();await carregar()}}catch(e){console.warn(e)}render()},0)});
$('#app').innerHTML='<p style="text-align:center;color:#c9b89b;padding:60px 20px;font-family:Georgia,serif;font-size:18px">Carregando o Lex Calc...</p>';
(async()=>{let data={session:null};try{data=(await Promise.race([SB.auth.getSession(),new Promise((_,r)=>setTimeout(()=>r(new Error('tempo')),8000))])).data}catch(e){console.warn(e)}U.user=data.session?data.session.user:null;if(U.user){try{await checarAssinatura();await carregar()}catch(e){console.warn(e)}}render();if(U.user&&/[?&]pago=/.test(location.search))aguardarPagamento()})();

/* Olhinho para mostrar ou esconder a senha */
const OLHO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',OLHO_X='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.4 3.4M6.6 6.6A17.5 17.5 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>';
function olhoSenha(){document.querySelectorAll('input[type=password]:not([data-olho])').forEach(i=>{i.dataset.olho=1;const w=document.createElement('span');w.className='olhoW';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='olhoB';b.title='Mostrar senha';b.innerHTML=OLHO;
 b.onclick=e=>{e.preventDefault();const ver=i.type==='password';i.type=ver?'text':'password';b.innerHTML=ver?OLHO_X:OLHO;b.title=ver?'Esconder senha':'Mostrar senha';i.focus()};w.appendChild(b)})}
new MutationObserver(olhoSenha).observe(document.documentElement,{childList:true,subtree:true});
/* Datas com barras automáticas (dd/mm/aaaa) em qualquer navegador e R$ nos campos de dinheiro */
const isoBr=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4):'';
function dataValida(d,m,a){const x=new Date(a,m-1,d);return a>=1900&&a<=2100&&x.getFullYear()===a&&x.getMonth()===m-1&&x.getDate()===d}
function mascaraData(){document.querySelectorAll('input[type=date]:not([data-mask])').forEach(o=>{o.dataset.mask=1;
 const w=document.createElement('span');w.className='dtW';o.parentNode.insertBefore(w,o);
 const t=document.createElement('input');t.type='text';t.inputMode='numeric';t.autocomplete='off';t.placeholder='dd/mm/aaaa';t.maxLength=10;t.className='dtT';if(o.getAttribute('style'))t.setAttribute('style',o.getAttribute('style'));t.disabled=o.disabled;t.value=isoBr(o.value);
 if(o.required){t.required=true;o.required=false}if(o.id){const l=document.querySelector(`label[for="${o.id}"]`);if(l){t.id=o.id+'_txt';l.htmlFor=t.id}}
 const b=document.createElement('button');b.type='button';b.className='dtB';b.title='Abrir calendário';b.tabIndex=-1;b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
 w.appendChild(t);w.appendChild(o);w.appendChild(b);
 const avisar=()=>{o.dispatchEvent(new Event('input',{bubbles:true}));o.dispatchEvent(new Event('change',{bubbles:true}))};
 t.addEventListener('input',e=>{const d=t.value.replace(/\D/g,'').slice(0,8);let f=d;if(d.length>4)f=d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4);else if(d.length>2)f=d.slice(0,2)+'/'+d.slice(2);if(t.value!==f)t.value=f;
  if(d.length===8){const dd=+d.slice(0,2),mm=+d.slice(2,4),aa=+d.slice(4);if(dataValida(dd,mm,aa)){o.value=d.slice(4)+'-'+d.slice(2,4)+'-'+d.slice(0,2);t.classList.remove('dtErr');t.setCustomValidity('');avisar()}else{t.classList.add('dtErr');t.setCustomValidity('Data inválida')}}
  else if(!d.length){o.value='';t.classList.remove('dtErr');t.setCustomValidity('');avisar()}else{t.setCustomValidity(t.required||d.length?'Complete a data: dia, mês e ano':'')}});
 t.addEventListener('blur',()=>{if(t.value&&t.value.length<10)t.classList.add('dtErr')});
 o.addEventListener('change',()=>{const v=isoBr(o.value);if(v!==t.value){t.value=v;t.classList.remove('dtErr');t.setCustomValidity('')}});
 b.onclick=e=>{e.preventDefault();try{o.showPicker()}catch(x){o.focus();o.click()}}})}
const DINHEIRO_CHAVE=/(^|[\s_\-.])(valor|valorpago|preco|precopacote|custo|abertura|total|pago|agvalbase|agexv|lv|pval|adia|ateto|cvc|tpri|tbase|ldvalor)($|[\s_\-.])/i;
function ehDinheiro(i){if(i.dataset.rs!==undefined)return i.dataset.rs!=='0';if(['checkbox','radio','date','hidden','file','time','email','tel','password'].includes(i.type))return false;
 const k=[i.name,i.id,...i.classList].filter(Boolean).join(' ');if(/(pct|percent|comiss|qtd|sessoes|dias|horas|duracao|intervalo|minimo|repetir|limite|peso|altura)/i.test(k))return false;
 if(DINHEIRO_CHAVE.test(k))return true;const l=i.closest('label');const tx=l?(l.querySelector('span')||l).textContent:'';return /R\$|\bvalor\b|\bpreço\b|\bcusto\b/i.test(tx)&&!/%|\bdias?\b|\bminutos?\b|\bsess/i.test(tx)}
function prefixoReais(){document.querySelectorAll('input:not([data-rsok])').forEach(i=>{i.dataset.rsok=1;if(!ehDinheiro(i))return;const w=document.createElement('span');w.className='rsW';i.parentNode.insertBefore(w,i);const s=document.createElement('span');s.className='rsP';s.textContent='R$';w.appendChild(s);w.appendChild(i)})}
new MutationObserver(()=>{mascaraData();prefixoReais()}).observe(document.documentElement,{childList:true,subtree:true});
</script>
