@media print{.top,.acts,.noprint,.bgleao{display:none!important}.soprint{display:block!important}body,html{background:#fff;color:#000}.panel,.kpi{background:#fff;border-color:#999}.kpi b,th{color:#000}.wrap{padding:0}td input{border:0;background:none;color:#000}}

<script>
const SB=supabase.createClient('https://blszdbjpxgtloblxlusr.supabase.co','sb_publishable_0Tns_mDN2N1iQmw_sEzFXw_SRMy1uXK');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const br=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';const mesBr=m=>m.slice(5,7)+'/'+m.slice(0,4);
const R=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const P=v=>(Number(v)||0).toLocaleString('pt-BR',{minimumFractionDigits:4,maximumFractionDigits:4})+'%';
const num=v=>{if(typeof v==='number')return v;let s=String(v??'').replace(/R\$|\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3500)}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox">${h}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const U={view:'inicio',user:null,calc:null,lista:[],busca:''};

/* ============ Índices oficiais (Banco Central, séries SGS) ============ */
const IND={ipca:{n:'IPCA (IBGE)',c:433},ipcae:{n:'IPCA-E (IBGE)',c:10764},inpc:{n:'INPC (IBGE)',c:188},igpm:{n:'IGP-M (FGV)',c:189},selic:{n:'Selic mensal',c:4390},igpdi:{n:'IGP-DI (FGV)',c:190}};
const CACHE={};
const mesesEntre=(a,b)=>{const out=[];let y=+a.slice(0,4),m=+a.slice(5,7);const Y=+b.slice(0,4),M=+b.slice(5,7);while(y<Y||(y===Y&&m<=M)){out.push(y+'-'+String(m).padStart(2,'0'));m++;if(m>12){m=1;y++}}return out};
const mesAnt=d=>{let y=+d.slice(0,4),m=+d.slice(5,7)-1;if(!m){m=12;y--}return y+'-'+String(m).padStart(2,'0')};const mesSeg=d=>{let y=+d.slice(0,4),m=+d.slice(5,7)+1;if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const dias=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);

/* Tabelas dos tribunais: cada uma é uma sequência de índices por período (mês de início) */
const TAB={
 t_tjsc:{n:'TJSC: tabela da Corregedoria-Geral da Justiça',p:[['1994-07','inpc'],['2024-09','ipca']],nota:'INPC (Provimento CGJ/SC 13/1995) e IPCA a partir de 30/08/2024 (Lei 14.905/2024).'},
 t_tjsp:{n:'TJSP: tabela prática',p:[['1995-07','inpc'],['2024-09','ipca']],nota:'INPC a partir de 07/1995 e IPCA a partir de 30/08/2024 (Lei 14.905/2024). Períodos anteriores a 07/1995 usam índices extintos que não estão no Lex Calc.'},
 t_tjrs:{n:'TJRS: tabela do Tribunal',p:[['1994-07','igpm'],['2024-09','ipca']],nota:'IGP-M e IPCA a partir de 30/08/2024 (Lei 14.905/2024).'},
 t_tjpr:{n:'TJPR: tabela da Corregedoria',p:[['1995-07','media'],['2024-09','ipca']],nota:'Média do INPC e do IGP-DI (Decreto 1.544/1995) e IPCA a partir de 30/08/2024 (Lei 14.905/2024).'},
 t_tjmg:{n:'TJMG: tabela da Corregedoria (ICGJ)',p:[['1994-07','inpc'],['2024-09','ipca']],nota:'INPC (índice da Corregedoria) e IPCA a partir de 30/08/2024 (Lei 14.905/2024).'},
 t_tjdft:{n:'TJDFT: tabela do Tribunal',p:[['1994-07','inpc'],['2024-09','ipca']],nota:'INPC e IPCA a partir de 30/08/2024 (Lei 14.905/2024).'},
 t_tj_inpc:{n:'Demais Tribunais de Justiça que adotam o INPC',p:[['1994-07','inpc'],['2024-09','ipca']],nota:'INPC e IPCA a partir de 30/08/2024 (Lei 14.905/2024).'},
 t_tj_ipcae:{n:'Demais Tribunais de Justiça que adotam o IPCA-E',p:[['1994-07','ipcae'],['2024-09','ipca']],nota:'IPCA-E e IPCA a partir de 30/08/2024 (Lei 14.905/2024).'},
 t_fazenda:{n:'Fazenda Pública: Justiça Federal e Estadual (Tema 810 e EC 113/2021)',p:[['1994-07','ipcae'],['2021-12','selic']],nota:'IPCA-E até 11/2021 e Selic a partir de 12/2021 (EC 113/2021), que já inclui correção e juros.'},
 t_prev:{n:'Justiça Federal: benefícios previdenciários (Manual do CJF)',p:[['2006-09','inpc'],['2021-12','selic']],nota:'INPC (Lei 11.430/2006, Tema 905 do STJ) até 11/2021 e Selic a partir de 12/2021 (EC 113/2021).'},
 t_trab:{n:'Justiça do Trabalho (ADC 58 do STF e Lei 14.905/2024)',trab:true,nota:'IPCA-E até a data do ajuizamento, Selic do ajuizamento até 29/08/2024 e IPCA mais taxa legal de juros a partir de 30/08/2024. Informe a data do ajuizamento no campo de juros.'}};
function periodosTab(k,ajuiz){const t=TAB[k];if(!t)return [['1900-01',k]];if(t.trab){const a=(ajuiz||'2099-12').slice(0,7);return [['1994-07','ipcae'],[a<'2024-09'?a:'2024-09',a<'2024-09'?'selic':'ipca'],['2024-09','ipca']].sort((x,y)=>x[0].localeCompare(y[0]))}return t.p}
function idxMes(per,m){let k=null;per.forEach(([ini,i])=>{if(m>=ini)k=i});return k}
async function valMes(i,m){if(i==='media'){const a=await serie('inpc',m),b=await serie('igpdi',m);return a[m]!=null&&b[m]!=null?(a[m]+b[m])/2:null}const s=await serie(i,m);return s[m]}
function nomeCrit(k){return TAB[k]?TAB[k].n:k==='nenhum'?'Sem correção':(IND[k]||{n:k}).n}
/* Correção: índices do mês da data até o mês anterior à data do cálculo */
async function correcao(k,data,ate,o){o=o||{};if(!k||k==='nenhum')return {f:1,ult:'',falta:0,selic:new Set(),antes:false};const per=periodosTab(k,o.ajuiz);const M=mesesEntre(data.slice(0,7),mesAnt(ate));let f=1,ult='',falta=0,antes=false,sSum=0;const selic=new Set();
 for(const m of M){const i=idxMes(per,m);if(!i){antes=true;continue}if(i==='selic')selic.add(m);const v=await valMes(i,data.slice(0,7)<=m?m:m);if(v==null){falta++;continue}if(o.semDeflacao&&v<0){ult=m;continue}if(i==='selic')sSum+=v;else f*=1+v/100;ult=m}
 f*=1+sSum/100;return {f,ult,falta,selic,antes}}
async function serie(k,desde){const c=IND[k].c;const ck=k;if(CACHE[ck])return CACHE[ck];
 let lc;try{lc=JSON.parse(localStorage.getItem('lx2:'+ck)||'null')}catch(e){}if(lc&&Date.now()-lc.t<12*3600e3)return CACHE[ck]=lc.m;
 const r=await fetch(`https://api.bcb.gov.br/dados/serie/bcdata.sgs.${c}/dados?formato=json&dataInicial=01/07/1994&dataFinal=${br(hoje())}`);if(!r.ok)throw new Error('Não foi possível buscar o índice '+IND[k].n+' no Banco Central agora. Tente de novo em instantes.');
 const j=await r.json();const m={};j.forEach(x=>{m[x.data.slice(6,10)+'-'+x.data.slice(3,5)]=num(x.valor)});try{localStorage.setItem('lx2:'+ck,JSON.stringify({t:Date.now(),m}))}catch(e){}return CACHE[ck]=m}
/* Juros: dias de cada período, sem contar os meses em que a Selic já corrige e remunera */
function pesoIni(ini,m){if(m!==ini.slice(0,7))return 1;const y=+m.slice(0,4),mm=+m.slice(5,7),dim=new Date(y,mm,0).getDate();return (dim-(+ini.slice(8,10))+1)/dim}
function diasFora(desde,ate,selic){let d=dias(desde,ate);if(!selic||!selic.size)return d;selic.forEach(m=>{const ini=m+'-01',fim=mesSeg(m+'-01')+'-01';const a=desde>ini?desde:ini,b=ate<fim?ate:fim;if(b>a)d-=dias(a,b)});return Math.max(0,d)}
function taxaLivre(c,d){const t=num(c.taxa)/100;if(!t||d<=0)return 0;const per=c.per==='a'?365:30;return (c.reg==='c'?Math.pow(1+t,d/per)-1:t*d/per)*100}
function nomeLivre(c){return `${String(c.taxa||0).replace('.',',')}% ao ${c.per==='a'?'ano':'mês'}, juros ${c.reg==='c'?'compostos (capitalizados)':'simples'}`}
async function juros(tipo,desde,ate,selic,cfg){if(!tipo||tipo==='nenhum'||!desde||desde>=ate)return {p:0,txt:'Sem juros'};
 if(tipo==='1c'){tipo='livre';cfg={taxa:'1',per:'m',reg:'c'}}if(tipo==='6a'){tipo='livre';cfg={taxa:'6',per:'a',reg:'s'}}if(tipo==='12a'){tipo='livre';cfg={taxa:'12',per:'a',reg:'s'}}
 if(tipo==='livre'){const c=cfg||{};const d=diasFora(desde,ate,selic);return {p:taxaLivre(c,d),txt:`${nomeLivre(c)}, ${d} dias${selic&&selic.size?' (fora do período da Selic)':''}`}}
 if(tipo==='selicc'){const s=await serie('selic');const M=mesesEntre(mesSeg(desde),mesAnt(ate));let f=1,n=0;M.forEach(m=>{if(s[m]!=null&&!(selic&&selic.has(m))){f*=1+s[m]/100;n++}});f*=1.01;return {p:(f-1)*100,txt:`Selic capitalizada de ${n} meses + 1% do mês do cálculo`}}
 if(tipo==='1'||tipo==='05'){const t=tipo==='1'?1:0.5;const d=diasFora(desde,ate,selic);return {p:t*d/30,txt:`${String(t).replace('.',',')}% ao mês, ${d} dias${selic&&selic.size?' (fora do período da Selic)':''}`}}
 if(tipo==='selic'){const s=await serie('selic');const M=mesesEntre(mesSeg(desde),mesAnt(ate));let p=0,n=0;M.forEach(m=>{if(s[m]!=null&&!(selic&&selic.has(m))){p+=s[m];n++}});p+=1;return {p,txt:`Selic acumulada de ${n} meses + 1% do mês do cálculo`}}
 if(tipo==='poup'){const s=await serie('selic');const M=mesesEntre(desde.slice(0,7),mesAnt(ate));let p=0,n=0;M.forEach(m=>{if(s[m]!=null&&!(selic&&selic.has(m))){p+=(s[m]*12>8.5?0.5:0.7*s[m])*pesoIni(desde,m);n++}});return {p,txt:`juros da poupança de ${n} meses (0,5% ao mês com Selic acima de 8,5% ao ano, ou 70% da Selic)`}}
 if(tipo==='legal'||tipo==='auto'){let p=0;const partes=[];
  if(tipo==='auto'){const cortes=[['1900-01-01','2003-01-11',0.5],['2003-01-11','2024-08-30',1]];for(const [a,b,t] of cortes){const ini=desde>a?desde:a,fim=ate<b?ate:b;if(fim>ini){const d=diasFora(ini,fim,selic);if(d){p+=t*d/30;partes.push(`${String(t).replace('.',',')}% ao mês por ${d} dias`)}}}}
  const ini=tipo==='auto'?(desde>'2024-08-30'?desde:'2024-08-30'):desde;if(ate>ini){const s=await serie('selic'),i=await serie('ipca');const M=mesesEntre(ini.slice(0,7),mesAnt(ate));let q=0,n=0;M.forEach(m=>{if(s[m]!=null&&i[m]!=null&&!(selic&&selic.has(m))){q+=Math.max(0,s[m]-i[m])*pesoIni(ini,m);n++}});if(n){p+=q;partes.push(`taxa legal (Selic menos IPCA) de ${n} meses`)}}
  return {p,txt:partes.join(' + ')||'Sem juros no período'}}
 return {p:0,txt:''}}
const TIPOS={mat:'Danos materiais',mor:'Danos morais',ind:'Repetição de indébito',luc:'Lucros cessantes',ali:'Pensão ou alimentos',cus:'Custas e despesas processuais',hon:'Honorários fixados em valor',pag:'Pagamento ou depósito (abatimento)',out:'Outra verba'};
const DICA_T={mat:'Correção desde o efetivo prejuízo (Súmula 43 do STJ). Juros desde a citação, se a responsabilidade for contratual (art. 405 do CC), ou desde o evento danoso, se extracontratual (Súmula 54 do STJ).',mor:'Correção desde o arbitramento, isto é, a data da sentença ou do acórdão que fixou o valor (Súmula 362 do STJ). Juros desde o evento danoso, se extracontratual (Súmula 54 do STJ), ou desde a citação, se contratual.',ind:'Correção desde cada pagamento indevido. Juros desde a citação. Marque Dobro quando a decisão aplicar o art. 42, parágrafo único, do CDC.',luc:'Correção desde cada mês em que o ganho deixou de entrar. Juros conforme a decisão.',ali:'Correção desde o vencimento de cada prestação. Juros desde cada vencimento.',cus:'Somente correção desde o desembolso, sem juros. Fica fora da base dos honorários percentuais e da cláusula penal.',hon:'Correção desde a fixação. Juros desde o trânsito em julgado (art. 85, §16, do CPC): informe essa data em Juros desde. Fica fora da base dos honorários percentuais.',pag:'Valor pago ou depositado pelo devedor. É atualizado pelos mesmos critérios até a data do cálculo e abatido antes da multa e dos honorários do art. 523, que incidem só sobre o saldo (art. 523, §2º, do CPC).',out:'Informe a data inicial da correção e, se houver, a data inicial dos juros fixadas na decisão.'};

 return `<div class="top"><div class="logo" onclick="ir('inicio')"><img src="assets/icone.png" alt=""><span>Lex <b>Calc</b></span></div><div class="nav">${it.map(([k,t])=>`<button class="${U.view===k?'on':''}" onclick="ir('${k}')">${t}</button>`).join('')}</div><div class="usr">${esc(U.user?U.user.email:'')}<button class="btn3" onclick="sair()">Sair</button></div></div>`}

 let V={inicio:vInicio,meus:vMeus,ajuda:vAjuda,calc:vCalc,assinar:vAssinar,config:vConfig}[U.view]||vInicio;if(!ASS.ok&&U.view!=='config')V=vAssinar;a.innerHTML=topo()+`<div class="bgleao"></div><div class="wrap">${U.view!=='assinar'&&ASS.ok?faixaAssinatura():''}${V()}</div>`;if(U.view==='calc')posCalc();if(U.view==='config')posConfig()}
function vInicio(){return `<h1>O que você deseja calcular?</h1><p class="sub">Selecione uma modalidade para começar.</p>
 <div class="grid3">${[['juridico','⚖','Cálculo jurídico','Atualização de valores, juros, multas e honorários.'],['liquidacao','🔨','Liquidação de sentença','Verbas da decisão, cumprimento de sentença e art. 523 do CPC.'],['tributario','％','Cálculo tributário','Débitos e restituições pela Selic e simulação de IBS e CBS.']].map(([k,s,t,d])=>`<div class="choice"><div class="sym">${s}</div><h2>${t}</h2><p>${d}</p><button class="btn" onclick="novo('${k}')">Iniciar cálculo ›</button></div>`).join('')}</div>
 <div class="panel"><h2>Buscar cálculo salvo</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="qb" placeholder="Nome do autor, do réu ou número do processo" value="${esc(U.busca)}" style="flex:1;min-width:220px;background:#111e27;border:1px solid #6e6a5e;border-radius:7px;padding:11px;color:#fff" onkeydown="if(event.key==='Enter')buscar(this.value)"><button class="btn" onclick="buscar($('#qb').value)">Buscar</button></div></div>
 <div class="panel"><h2>Meus cálculos recentes</h2>${listaHTML(U.lista.slice(0,6))}</div>`}
function listaHTML(L){if(!L.length)return `<p class="sub" style="text-align:center;padding:20px">Seus cálculos aparecerão aqui.</p>`;
 return L.map(c=>`<div class="rec"><div><b>${esc(c.autor)} × ${esc(c.reu)}</b>${c.sem_numero?'<span class="tag bad">Sem número do processo</span>':''}<br><small>${esc(c.processo||'Processo ainda sem número')} · ${({juridico:'Cálculo jurídico',liquidacao:'Liquidação de sentença',tributario:'Cálculo tributário'})[c.tipo]||c.tipo} · atualizado em ${new Date(c.atualizado_em).toLocaleDateString('pt-BR')}${c.resultado&&c.resultado.total!=null?' · '+R(c.resultado.total):''}</small></div><div style="display:flex;gap:8px"><button class="btn2" onclick="abrir('${c.id}')">Abrir e atualizar</button></div></div>`).join('')}
function vMeus(){const q=U.busca;return `<h1>Meus cálculos</h1><p class="sub">Busque pelo nome do autor, do réu ou pelo número do processo.</p>
 <div class="panel"><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="qb" placeholder="Autor, réu ou número do processo" value="${esc(q)}" style="flex:1;min-width:220px;background:#111e27;border:1px solid #6e6a5e;border-radius:7px;padding:11px;color:#fff" onkeydown="if(event.key==='Enter')buscar(this.value)"><button class="btn" onclick="buscar($('#qb').value)">Buscar</button>${q?'<button class="btn2" onclick="buscar(\'\')">Limpar</button>':''}</div>
 <div style="margin-top:16px">${listaHTML(U.lista)}</div></div>`}
function vAjuda(){return `<h1>Ajuda</h1><div class="panel" style="line-height:1.7">
 <h3 style="margin-top:0">Como os cálculos são salvos</h3><p>No primeiro cálculo de um processo, informe o autor, o réu e o número do processo. Se o processo foi distribuído para cumprimento de sentença e ainda não tem número, marque <b>Distribuído sem número</b>. Nas próximas atualizações desse cálculo, o número do processo passa a ser obrigatório. Para encontrar um cálculo depois, basta digitar o nome do autor, do réu ou o número do processo.</p>
 <h3>Tabelas dos tribunais</h3><p>Escolha a tabela do tribunal do processo: TJSC, TJSP, TJRS, TJPR, TJMG, TJDFT, demais Tribunais de Justiça pelo INPC ou pelo IPCA-E, Fazenda Pública (Tema 810 e EC 113/2021), benefícios previdenciários (Manual do CJF) e Justiça do Trabalho (ADC 58). Cada tabela troca de índice sozinha na data certa, inclusive a mudança para o IPCA a partir de 30/08/2024 (Lei 14.905/2024). O critério usado aparece no relatório. Os índices são atualizados automaticamente a cada cálculo, direto do Banco Central.</p><h3>Cálculo individual ou por parcelas</h3><p>No cálculo jurídico, o modo individual serve para um ou poucos valores. O modo por parcelas gera aluguéis, prestações ou pensões mês a mês: informe o valor, a quantidade e o primeiro vencimento, e cada parcela é corrigida a partir do próprio vencimento.</p><h3>De onde vêm os índices</h3><p>IPCA, IPCA-E, INPC, IGP-M e Selic são buscados no Banco Central (sistema SGS) no momento do cálculo. A correção usa os índices do mês da data do valor até o mês anterior à data do cálculo. Quando um índice ainda não foi divulgado, o cálculo usa o último disponível e avisa no relatório.</p>
 <h3>Juros</h3><p>Juros legais por período aplicam 0,5% ao mês até 10/01/2003, 1% ao mês até 29/08/2024 e a taxa legal depois. Nos meses em que a tabela usa a Selic, não há juros separados, porque a Selic já inclui juros. 1% ou 0,5% ao mês são juros simples, contados por dia (mês de 30 dias). Selic acumulada segue a regra da Receita Federal: soma das taxas mensais a partir do mês seguinte, mais 1% no mês do cálculo. A taxa legal da Lei 14.905/2024 é a Selic menos o IPCA de cada mês, nunca negativa.</p>
 <h3>Liquidação de sentença</h3><p>Cada verba tem o seu tipo, o termo inicial da correção e, se a decisão fixar, o termo inicial dos juros. Danos morais: correção desde o arbitramento (Súmula 362 do STJ) e juros desde o evento danoso (Súmula 54 do STJ) ou desde a citação. Danos materiais: correção desde o prejuízo (Súmula 43 do STJ). Custas: somente correção. Honorários fixados em valor: juros desde o trânsito em julgado (art. 85, §16, do CPC). Repetição de indébito pode ser calculada em dobro (art. 42, parágrafo único, do CDC). Pagamentos e depósitos do devedor são atualizados e abatidos antes da multa e dos honorários do art. 523, que incidem só sobre o saldo (art. 523, §2º, do CPC). A multa diária (astreintes) é somada ao débito, respeitando o limite fixado. Os honorários de sucumbência podem ser calculados sobre a condenação ou sobre o valor da causa atualizado. Nos meses em que a tabela usa a Selic, ela já inclui correção e juros, então não há juros separados.</p>
 <h3>Configurações e voucher</h3><p>Em Configurações você vê a situação da assinatura, usa um voucher, troca a senha, informa os dados do escritório que saem no relatório e escolhe a tabela, os juros e os honorários padrão dos cálculos novos.</p>
 <h3>Todos os tipos de juros</h3><p>Juros de mora: juros legais por período, 1% ao mês simples ou capitalizado, 0,5% ao mês, 6% ou 12% ao ano, Selic acumulada (soma simples) ou capitalizada, taxa legal da Lei 14.905/2024, juros da poupança da Fazenda Pública ou <b>taxa livre</b>, em que o advogado informa qualquer percentual, ao mês ou ao ano, simples ou compostos. Juros compensatórios (remuneratórios): taxa livre, simples ou compostos, com período próprio, calculados em separado e, se marcado, com juros de mora também sobre eles (Súmula 102 do STJ). Juros simples são proporcionais aos dias (mês de 30 dias e ano de 365 dias). Juros compostos usam a fórmula (1 + taxa) elevado ao número de períodos, também proporcional aos dias. A capitalização só é permitida quando a lei, o contrato ou a decisão autorizar (Súmula 121 do STF, Súmula 539 do STJ e art. 591 do CC).</p>
 <h3>Cálculo tributário</h3><p>O débito federal segue a regra do Sicalc: juros pela Selic e multa de mora de 0,33% por dia de atraso, limitada a 20%. A simulação de IBS e CBS usa as alíquotas que você informar; para 2026, o ano de teste, as alíquotas são CBS 0,9% e IBS 0,1%. Para conferência oficial, use o Sicalc da Receita Federal e o Portal da Tributação sobre o Consumo.</p>
 <p class="notice">O Lex Calc é uma ferramenta de apoio. Confira os critérios da decisão judicial e da legislação aplicável ao caso antes de apresentar o cálculo.</p></div>`}

function vazio(tipo){const pf=pref();return {tipo,processo:'',autor:'',reu:'',sem_numero:false,dados:{dataCalculo:hoje(),indice:pf.indice||'t_tjsc',juros:pf.juros||'auto',modo:'individual',parc:{valor:'',qtd:'12',primeiro:'',dia:''},semDeflacao:false,jurosDesde:'',multa:0,honorarios:pf.honorarios||0,art523:false,honBase:'cond',vcValor:'',vcData:'',astr:{dia:'',ini:'',fim:'',teto:''},lanc:[{data:'',valor:'',desc:'',tipo:tipo==='liquidacao'?'mat':''}],trib:{modo:'debito',principal:'',venc:'',pag:hoje(),base:'',ano:'2026',cbs:'0,9',ibs:'0,1',is:'0'}},resultado:null}}
function novo(tipo){U.calc=vazio(tipo);U.view='calc';render();window.scrollTo(0,0)}
function vCalc(){const c=U.calc,d=c.dados;const T={juridico:'Novo cálculo jurídico',liquidacao:'Liquidação de sentença',tributario:'Cálculo tributário'}[c.tipo];
 const tituloOk=c.id?(c.tipo==='juridico'?'Cálculo jurídico':T):T;
 return `<h1>${tituloOk}</h1>${c.id&&c.sem_numero?`<div class="notice bad"><b>Este processo ainda está sem número.</b> Para salvar esta atualização, informe o número do processo. Ele passou a ser obrigatório depois do primeiro cálculo.</div>`:''}
 <div class="panel noprint"><h3 style="margin-top:0">Dados do processo</h3><div class="fields">
  <div class="f s2"><label>Número do processo ${c.sem_numero&&!c.id?'':'*'}</label><input id="cProc" value="${esc(c.processo)}" placeholder="Digite o número dos autos" ${c.sem_numero&&!c.id?'disabled':''}></div>
  <div class="f"><label>Data do cálculo *</label><input type="date" id="cData" value="${d.dataCalculo}"></div>
  <div class="f" style="justify-content:flex-end">${!c.id?`<label class="chk"><input type="checkbox" id="cSem" ${c.sem_numero?'checked':''} onchange="U.calc.sem_numero=this.checked;lerForm();render()"> Distribuído sem número</label>`:''}</div>
  <div class="f s2"><label>Autor *</label><input id="cAutor" value="${esc(c.autor)}"></div><div class="f s2"><label>Réu *</label><input id="cReu" value="${esc(c.reu)}"></div></div>
  ${c.tipo==='tributario'?formTrib(d):formLanc(c,d)}
  <div class="acts"><button class="btn2" onclick="salvar()">💾 Salvar</button><button class="btn" onclick="calcular()">Calcular</button></div></div>
  <div id="res" class="res">${c.resultado?resHTML(c.resultado):''}</div>`}
function selPct(id,rot,val,ops){val=String(val??'0').replace('.',',');const outro=!ops.includes(val);return `<div class="f"><label>${rot}</label><div style="display:flex;gap:6px"><select id="${id}" onchange="const o=document.getElementById('${id}O');o.style.display=this.value==='o'?'block':'none';if(this.value==='o')o.focus()" style="flex:1">${ops.map(o=>`<option value="${o}" ${!outro&&val===o?'selected':''}>${o==='0'?'Sem':o+'%'}</option>`).join('')}<option value="o" ${outro?'selected':''}>Outro</option></select><input id="${id}O" placeholder="%" value="${outro?esc(val):''}" style="width:80px;display:${outro?'block':'none'}"></div></div>`}
function pctLer(id){const s=document.getElementById(id);if(!s)return 0;return s.value==='o'?(document.getElementById(id+'O').value||'0'):s.value}
function formLanc(c,d){const liq=c.tipo==='liquidacao';const par=!liq&&d.modo==='parcelas';const pc=d.parc||{};
 return `${!liq?`<h3>Tipo de cálculo</h3><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="${d.modo!=='parcelas'?'btn':'btn2'}" onclick="lerForm();U.calc.dados.modo='individual';U.calc.dados.lanc=U.calc.dados.lanc.slice(0,Math.max(1,U.calc.dados.lanc.length));render()">Cálculo individual</button><button class="${par?'btn':'btn2'}" onclick="lerForm();U.calc.dados.modo='parcelas';render()">Cálculo por parcelas</button></div>
 <p class="sub" style="margin-top:8px">${par?'Gere as parcelas automaticamente (aluguéis, prestações, pensão) ou digite cada uma na tabela. Cada parcela é corrigida a partir do próprio vencimento.':'Um ou mais valores, cada um com a sua data. Use valor negativo para descontar pagamentos.'}</p>
 ${par?`<div class="fields" style="margin-top:12px"><div class="f"><label>Valor de cada parcela (R$)</label><input id="pVal" value="${esc(pc.valor||'')}"></div><div class="f"><label>Quantidade de parcelas</label><input id="pQtd" value="${esc(pc.qtd||'12')}"></div><div class="f"><label>Primeiro vencimento</label><input type="date" id="pIni" value="${pc.primeiro||''}"></div><div class="f" style="justify-content:flex-end"><button class="btn2" onclick="gerarParcelas()">Gerar parcelas</button></div></div>`:''}`:''}
 ${liq?`<div class="notice" style="margin-top:4px">Lance cada verba da condenação na sua linha e escolha o tipo. A <b>data</b> é o termo inicial da correção monetária e o campo <b>Juros desde</b> é o termo inicial dos juros de cada verba. Se ficar vazio, vale o campo geral de juros mais abaixo. Pagamentos e depósitos do devedor entram como abatimento.</div>`:''}
 <h3>${liq?'Verbas da condenação':par?'Parcelas':'Lançamentos'}</h3><div style="overflow:auto"><table><thead><tr>${liq?'<th style="width:190px">Tipo</th>':''}<th style="width:150px">${liq?'Correção desde':'Data'}</th><th style="width:140px">Valor (R$)</th><th>Descrição</th>${liq?'<th style="width:170px">Índice próprio</th><th style="width:150px">Juros desde</th><th style="width:60px">Dobro</th>':''}<th style="width:40px"></th></tr></thead><tbody id="tl">
 ${d.lanc.map((l,i)=>`<tr>${liq?`<td><select class="lT" onchange="const x=this.closest('tr').nextElementSibling;if(x&&x.classList.contains('dr'))x.querySelector('td').textContent=DICA_T[this.value]||''">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}" ${(l.tipo||'out')===k?'selected':''}>${t}</option>`).join('')}</select></td>`:''}<td><input type="date" class="lD" value="${l.data||''}"></td><td><input class="lV" value="${l.valor??''}" placeholder="0,00"></td><td><input class="lX" value="${esc(l.desc||'')}" placeholder="${liq?'Ex.: indenização fixada na sentença':'Descreva o lançamento. Use valor negativo para pagamentos.'}"></td>${liq?`<td><select class="lI"><option value="">Igual ao geral</option>${OPT_IND}</select></td><td><input type="date" class="lJ" value="${l.jurosDesde||''}"></td><td style="text-align:center"><input type="checkbox" class="lB" ${l.dobro?'checked':''} title="Repetição em dobro (art. 42, parágrafo único, do CDC)" style="width:18px;height:18px;accent-color:var(--gold)"></td>`:''}<td><button class="btn3" title="Remover" onclick="lerForm();U.calc.dados.lanc.splice(${i},1);if(!U.calc.dados.lanc.length)U.calc.dados.lanc.push({tipo:'mat'});render()">✕</button></td></tr>${liq?`<tr class="dr"><td colspan="8" class="dica" style="border-bottom:1px solid #2b3a44;padding-top:0">${DICA_T[l.tipo||'out']||''}</td></tr>`:''}`).join('')}</tbody></table></div>
 <button class="btn2" style="margin-top:10px" onclick="lerForm();U.calc.dados.lanc.push({data:'',valor:'',desc:'',tipo:'mat'});render()">+ Adicionar ${liq?'verba':'lançamento'}</button>
 ${liq?`<h3>Multa diária (astreintes)</h3><p class="sub">Preencha somente se a decisão fixou multa cominatória. O total é corrigido a partir do último dia da multa, sem juros.</p><div class="fields" style="margin-top:10px"><div class="f"><label>Valor por dia (R$)</label><input id="aDia" value="${esc((d.astr||{}).dia||'')}"></div><div class="f"><label>Primeiro dia de descumprimento</label><input type="date" id="aIni" value="${(d.astr||{}).ini||''}"></div><div class="f"><label>Último dia de descumprimento</label><input type="date" id="aFim" value="${(d.astr||{}).fim||''}"></div><div class="f"><label>Limite fixado na decisão (R$)</label><input id="aTeto" value="${esc((d.astr||{}).teto||'')}" placeholder="Sem limite"></div></div>`:''}
 <h3>Critérios de atualização</h3><div class="fields">
  <div class="f s2"><label>Tabela do tribunal ou índice de correção *</label><select id="cInd" onchange="const n=$('#cNota');if(n)n.textContent=TAB[this.value]?TAB[this.value].nota:''">${OPT_IND}</select><small id="cNota" style="color:var(--mut)">${TAB[d.indice]?esc(TAB[d.indice].nota):''}</small></div>
  <div class="f s2"><label>Juros de mora *</label><select id="cJur" onchange="document.querySelectorAll('.jl').forEach(e=>e.classList.toggle('hide',this.value!=='livre'))">${OPT_JUR}</select></div>
  ${blocoTaxa('jl','Juros de mora',d.jl||{},d.juros!=='livre')}
  <div class="f"><label>Juros desde (citação; na Justiça do Trabalho, o ajuizamento). Vazio: data de cada valor</label><input type="date" id="cJD" value="${d.jurosDesde||''}"></div>
  <div class="f"><label>Multa moratória (%)</label><input id="cMul" value="${d.multa||0}"></div>
  ${selPct('cCla','Cláusula penal (sobre o valor corrigido)',d.clausula,['0','10','20','30','40','50'])}
  ${selPct('cHon','Honorários de sucumbência',d.honorarios,['0','10','15','20','25','30','35','40','45','50'])}
  ${selPct('cHoc','Honorários contratuais',d.honCont,['0','10','15','20','25','30','35','40','45','50'])}
  ${liq?`<div class="f s2"><label>Base dos honorários de sucumbência</label><select id="cHB" onchange="document.querySelectorAll('.vc').forEach(e=>e.classList.toggle('hide',this.value!=='causa'))"><option value="cond" ${d.honBase!=='causa'?'selected':''}>Valor da condenação (sem custas, sem honorários fixos e sem abatimentos)</option><option value="causa" ${d.honBase==='causa'?'selected':''}>Valor da causa atualizado (art. 85, §2º, do CPC)</option></select></div><div class="f vc ${d.honBase==='causa'?'':'hide'}"><label>Valor da causa (R$)</label><input id="cVC" value="${esc(d.vcValor||'')}"></div><div class="f vc ${d.honBase==='causa'?'':'hide'}"><label>Data do ajuizamento</label><input type="date" id="cVD" value="${d.vcData||''}"></div>`:''}
  <div class="f s2" style="justify-content:flex-end"><label class="chk"><input type="checkbox" id="cHcl" ${d.honSobreClausula?'checked':''}> Honorários também sobre a cláusula penal</label></div>
  <div class="f s4"><h3 style="margin:8px 0 0">Juros compensatórios (remuneratórios)</h3><p class="dica">Use quando a decisão ou o contrato fixar juros que remuneram o capital, como nas desapropriações (Súmulas 12, 69 e 618 do STJ), nos contratos bancários e no mútuo (art. 591 do CC). São calculados sobre o valor corrigido, em separado dos juros de mora.</p></div>

  if(!fundo&&np===1&&pf.escritorio){txt(pf.escritorio,ML,y,FB,12);y-=14;if(pf.advogado){txt(pf.advogado+(pf.oab?' · OAB '+pf.oab:''),ML,y,F,9,cinza);y-=12}if(pf.contato){txt(pf.contato,ML,y,F,9,cinza);y-=12}y-=6;pg.drawLine({start:{x:ML,y},end:{x:W-MR,y},thickness:.6,color:cinza});y-=16}}
 function txt(t,x,yy,f,z,cor){pg.drawText(limpa(t),{x,y:yy,size:z,font:f||F,color:cor||preto})}
 function precisa(h){if(y-h<rod){novaPag();return true}return false}
 novaPag();
 txt(D.titulo,ML,y,FB,15,verm);y-=8;pg.drawLine({start:{x:ML,y},end:{x:W-MR,y},thickness:.6,color:cinza});y-=16;
 D.cab.forEach(([k,v])=>{const ls=quebra(k+': '+v,W-ML-MR,F,9.5);ls.forEach((l,i)=>{precisa(13);if(i===0){txt(k+':',ML,y,FB,9.5);txt(l.slice(k.length+1),ML+larg(k+':',FB,9.5),y,F,9.5)}else txt(l,ML,y,F,9.5);y-=13})});y-=8;
 const tw=W-ML-MR,fixo=D.cols.reduce((s,c)=>s+c[1],0),cw=D.cols.map(c=>c[1]||tw-fixo);
 const xs=[];let ax=ML;cw.forEach(w=>{xs.push(ax);ax+=w});
 function celula(t,i,yy,f,z){const a=D.cols[i][2],w=cw[i];const tt=limpa(t);if(a==='r')txt(tt,xs[i]+w-larg(tt,f,z)-2,yy,f,z);else if(a==='c')txt(tt,xs[i]+(w-larg(tt,f,z))/2,yy,f,z);else txt(tt,xs[i]+2,yy,f,z)}
 function cabTab(){const ls=D.cols.map((c,i)=>quebra(c[0],cw[i]-4,FB,8));const n=Math.max(...ls.map(x=>x.length));precisa(n*10+8);ls.forEach((l,i)=>l.forEach((t,k)=>celula(t,i,y-(n-l.length+k)*10,FB,8)));y-=n*10;pg.drawLine({start:{x:ML,y:y+4},end:{x:W-MR,y:y+4},thickness:.5,color:cinza});y-=8}
 cabTab();
 D.rows.forEach(rw=>{const ls=rw.map((t,i)=>D.cols[i][2]==='l'?quebra(t,cw[i]-4,F,8):[t]);const n=Math.max(...ls.map(x=>x.length));if(precisa(n*10+2))cabTab();ls.forEach((l,i)=>l.forEach((t,k)=>celula(t,i,y-k*10,F,8)));y-=n*10+3});
 if(D.tot){precisa(16);pg.drawLine({start:{x:ML,y:y+7},end:{x:W-MR,y:y+7},thickness:.5,color:cinza});D.tot.forEach((t,i)=>celula(t,i,y-2,FB,8));y-=18}
 const xv=W-MR;D.acr.forEach(([k,v,neg])=>{const ls=quebra(k,tw-110,neg?FB:F,9);precisa(ls.length*12+4);ls.forEach((l,i)=>{txt(l,xv-100-larg(l,neg?FB:F,9),y-i*12,neg?FB:F,9)});const vv='R$ '+nR(v);txt(vv,xv-larg(vv,neg?FB:F,9),y,neg?FB:F,9);y-=ls.length*12+4});
 precisa(30);y-=4;pg.drawLine({start:{x:xv-170,y:y+10},end:{x:xv,y:y+10},thickness:.8,color:preto});txt('TOTAL GERAL',xv-100-larg('TOTAL GERAL',FB,10.5),y-4,FB,10.5);const tg='R$ '+nR(D.total);txt(tg,xv-larg(tg,FB,10.5),y-4,FB,10.5);y-=28;
 const bloco=(tit,linhas,z)=>{if(!linhas.length)return;precisa(30);txt(tit,ML,y,FB,9.5);y-=13;linhas.forEach(t=>quebra(t,tw,F,z).forEach(l=>{precisa(11);txt(l,ML,y,F,z,cinza);y-=11}));y-=8};
 bloco('Memória de cálculo',D.memo,7.5);if(D.crit)bloco('Critérios',[D.crit],7.5);
 if(pf.advogado){precisa(60);y-=30;const ln='______________________________';const cx=W/2;txt(ln,cx-larg(ln,F,10)/2,y,F,10);y-=13;txt(pf.advogado,cx-larg(pf.advogado,F,10)/2,y,F,10);if(pf.oab){y-=12;const o='OAB '+pf.oab;txt(o,cx-larg(o,F,9)/2,y,F,9)}}
 const ps=pdf.getPages(),gerado='Planilha gerada pelo Lex Calc em '+new Date().toLocaleDateString('pt-BR');ps.forEach((p,i)=>{const t=gerado+'   ·   Página '+(i+1)+' de '+ps.length;p.drawText(limpa(t),{x:W-MR-F.widthOfTextAtSize(limpa(t),7),y:Math.max(14,rod-16),size:7,font:F,color:cinza})});
 pdf.setTitle(D.titulo);pdf.setCreator('Lex Calc');return await pdf.save()}
function nomeArq(){const c=U.calc||{};return ('Planilha '+(c.autor||'calculo')+' x '+(c.reu||'')+' '+((c.resultado&&c.resultado.ate)||hoje())).replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ').trim()+'.pdf'}
async function planilha(acao,b){const t0=b?b.textContent:'';if(b){b.disabled=true;b.textContent='Gerando...'}
 try{const bytes=await gerarPlanilha();const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  if(acao==='baixar'){const a=document.createElement('a');a.href=url;a.download=nomeArq();document.body.appendChild(a);a.click();a.remove();toast('Planilha baixada')}
  else{let f=document.getElementById('frPlan');if(f)f.remove();f=document.createElement('iframe');f.id='frPlan';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';f.src=url;f.onload=()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){window.open(url,'_blank')}};document.body.appendChild(f)}
  setTimeout(()=>URL.revokeObjectURL(url),120000)}catch(e){toast(e.message||String(e))}finally{if(b){b.disabled=false;b.textContent=t0}}}
const BOT_PLAN=`<div class="acts noprint"><button class="btn2" onclick="planilha('imprimir',this)">🖨 Imprimir planilha</button><button class="btn" onclick="planilha('baixar',this)">⬇ Baixar planilha em PDF</button></div>`;
/* Papel timbrado */
async function enviarTimbrado(inp){const f=inp.files&&inp.files[0];if(!f)return;const ok=['application/pdf','image/png','image/jpeg'];if(!ok.includes(f.type)){toast('Envie um arquivo PDF, PNG ou JPG.');inp.value='';return}if(f.size>8*1048576){toast('O arquivo passa de 8 MB. Envie uma versão menor.');inp.value='';return}
 const ext={'application/pdf':'pdf','image/png':'png','image/jpeg':'jpg'}[f.type];const path=U.user.id+'/timbrado.'+ext;toast('Enviando o papel timbrado...');
 const old=pref().timbrado;if(old&&old.path&&old.path!==path){try{await SB.storage.from('lexcalc').remove([old.path])}catch(e){}}
 const {error}=await SB.storage.from('lexcalc').upload(path,f,{upsert:true,contentType:f.type});if(error){toast('Não foi possível enviar: '+error.message);inp.value='';return}
 const p=Object.assign({},pref(),{timbrado:{path,tipo:f.type,nome:f.name,topo:(old&&old.topo)||'4',rodape:(old&&old.rodape)||'3'}});const {data,error:e2}=await SB.auth.updateUser({data:{lexcalc:p}});if(e2){toast('Arquivo enviado, mas não foi possível salvar: '+e2.message);return}U.user=data.user;toast('Papel timbrado salvo');render()}
async function tirarTimbrado(){const t=pref().timbrado;if(t&&t.path){try{await SB.storage.from('lexcalc').remove([t.path])}catch(e){}}const p=Object.assign({},pref());delete p.timbrado;const {data,error}=await SB.auth.updateUser({data:{lexcalc:p}});if(error){toast(error.message);return}U.user=data.user;toast('Papel timbrado removido');render()}
async function testarTimbrado(b){const ant=U.calc;U.calc={processo:'0000000-00.0000.8.24.0000',autor:'Autor de exemplo',reu:'Réu de exemplo',tipo:'juridico',dados:Object.assign(vazio('juridico').dados,{juros:'1'}),resultado:{tipo:'juridico',ate:hoje(),linhas:[{data:'2025-01-10',desc:'Valor de exemplo',valor:1000,fator:1.05,corrigido:1050,juros:230,jurosTxt:'1% ao mês',total:1280,indice:'TJSC'}],sub:1280,principal:1000,corrigido:1050,juros:230,multa:0,clausula:0,hon:128,honc:0,m523:0,h523:0,pagos:0,astr:0,total:1408,avisos:[],criterios:'Exemplo para conferir o papel timbrado.'}};
 try{await planilha('imprimir',b)}finally{U.calc=ant}}

/* ============ Salvar, buscar e abrir ============ */
async function salvar(){lerForm();const c=U.calc;
 if(!c.autor||!c.reu){toast('Informe o autor e o réu.');return}
 const temNum=!!c.processo;if(!temNum){if(c.id){toast('Informe o número do processo. Depois do primeiro cálculo ele é obrigatório.');$('#cProc').focus();return}if(!c.sem_numero){toast('Informe o número do processo ou marque Distribuído sem número.');return}}
 const row={tipo:c.tipo,processo:c.processo||null,autor:c.autor,reu:c.reu,sem_numero:!temNum,dados:c.dados,resultado:c.resultado,atualizado_em:new Date().toISOString()};
 const q=c.id?SB.from('lexcalc_calculos').update(row).eq('id',c.id).select().single():SB.from('lexcalc_calculos').insert(row).select().single();
 const {data,error}=await q;if(error){toast('Não foi possível salvar: '+error.message);return}Object.assign(c,data);toast('Cálculo salvo na nuvem');await carregar();render()}
async function carregar(){let q=SB.from('lexcalc_calculos').select('id,tipo,processo,autor,reu,sem_numero,resultado,atualizado_em').order('atualizado_em',{ascending:false}).limit(60);
 const b=U.busca.trim();if(b){const s=b.replace(/[%,()]/g,' ');q=q.or(`autor.ilike.%${s}%,reu.ilike.%${s}%,processo.ilike.%${s}%`)}
 const {data,error}=await q;if(error){toast('Não foi possível carregar os cálculos: '+error.message);U.lista=[];return}U.lista=data||[]}
async function buscar(t){U.busca=String(t||'');await carregar();ir('meus')}
async function abrir(id){const {data,error}=await SB.from('lexcalc_calculos').select('*').eq('id',id).single();if(error){toast('Não foi possível abrir');return}
 data.dados=Object.assign(vazio(data.tipo).dados,data.dados||{});data.dados.dataCalculo=hoje();U.calc=data;U.view='calc';render();window.scrollTo(0,0)}

/* ============ Entrar ============ */
function telaLogin(){const m=U.lmodo||'entrar';
 return `<div class="login"><div class="art"></div><div class="lbox"><h1 class="serif">Lex Calc</h1><p class="sl">Cálculos jurídicos e tributários</p><div class="lcard">
 <h2>${m==='entrar'?'Bem-vindo ao Lex Calc':m==='criar'?'Criar conta':m==='codigo'?'Confirme o seu e-mail':'Recuperar senha'}</h2>
 ${m==='codigo'?`<p class="sub" style="margin-bottom:12px">Enviamos um código para ${esc(U.lemail||'')}. Digite o código para continuar.</p><div class="f"><label>Código</label><input id="lCod" inputmode="numeric" autocomplete="one-time-code"></div>${U.lrec?`<div class="f"><label>Nova senha</label><input id="lSen" type="password" autocomplete="new-password"></div>`:''}<button class="btn" onclick="confirmar()">Confirmar</button>`
 :`<div class="f"><label>E-mail</label><input id="lEm" type="email" autocomplete="email" value="${esc(U.lemail||'')}"></div>${m!=='recuperar'?`<div class="f"><label>Senha</label><input id="lSen" type="password" autocomplete="${m==='criar'?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')entrar()"></div>`:''}
 <button class="btn" onclick="${m==='entrar'?'entrar()':m==='criar'?'criar()':'recuperar()'}">${m==='entrar'?'Entrar':m==='criar'?'Criar conta':'Enviar código'}</button>`}
 <p style="text-align:center;margin:16px 0 0">${m==='entrar'?`<button class="btn3" onclick="U.lmodo='recuperar';render()">Esqueci minha senha</button> · <button class="btn3" onclick="U.lmodo='criar';render()">Criar conta</button>`:`<button class="btn3" onclick="U.lmodo='entrar';U.lrec=0;render()">Voltar para entrar</button>`}</p>
 </div><p class="sub" style="text-align:center;margin-top:14px;font-size:12px">Lex Calc · BlackSolutions</p></div></div>`}
async function entrar(){const email=$('#lEm').value.trim(),password=$('#lSen').value;U.lemail=email;const {error}=await SB.auth.signInWithPassword({email,password});if(error){toast(/confirm/i.test(error.message)?'Confirme o e-mail antes de entrar.':'E-mail ou senha incorretos.');return}}
async function criar(){const email=$('#lEm').value.trim(),password=$('#lSen').value;if(password.length<8){toast('A senha precisa ter pelo menos 8 caracteres.');return}U.lemail=email;const {data,error}=await SB.auth.signUp({email,password,options:{data:{app:'lexcalc'}}});if(error){toast(error.message);return}if(data.session)return;U.lmodo='codigo';U.lrec=0;render()}
async function recuperar(){const email=$('#lEm').value.trim();U.lemail=email;const {error}=await SB.auth.resetPasswordForEmail(email);if(error){toast(error.message);return}U.lmodo='codigo';U.lrec=1;render()}
async function confirmar(){const token=$('#lCod').value.trim();const {error}=await SB.auth.verifyOtp({email:U.lemail,token,type:U.lrec?'recovery':'signup'});if(error){toast('Código inválido ou vencido.');return}
 if(U.lrec){const {error:e2}=await SB.auth.updateUser({password:$('#lSen').value});if(e2){toast(e2.message);return}toast('Senha alterada')}U.lmodo='entrar';U.lrec=0}
async function sair(){await SB.auth.signOut()}
/* O Supabase trava se outra chamada a ele for feita dentro deste aviso: o trabalho roda logo depois, fora dele */
SB.auth.onAuthStateChange((ev,sess)=>{const u=sess?sess.user:null;const mudou=(u&&u.id)!==(U.user&&U.user.id);U.user=u;if(!mudou&&ev!=='SIGNED_OUT')return;
 setTimeout(async()=>{try{if(u){await checarAssinatura();await carregar()}}catch(e){console.warn(e)}render()},0)});
$('#app').innerHTML='<p style="text-align:center;color:#c9b89b;padding:60px 20px;font-family:Georgia,serif;font-size:18px">Carregando o Lex Calc...</p>';
(async()=>{let data={session:null};try{data=(await Promise.race([SB.auth.getSession(),new Promise((_,r)=>setTimeout(()=>r(new Error('tempo')),8000))])).data}catch(e){console.warn(e)}U.user=data.session?data.session.user:null;if(U.user){try{await checarAssinatura();await carregar()}catch(e){console.warn(e)}}render();if(U.user&&/[?&]pago=/.test(location.search))aguardarPagamento()})();

/* Olhinho para mostrar ou esconder a senha */
const OLHO='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',OLHO_X='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-2.4 3.4M6.6 6.6A17.5 17.5 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>';
function olhoSenha(){document.querySelectorAll('input[type=password]:not([data-olho])').forEach(i=>{i.dataset.olho=1;const w=document.createElement('span');w.className='olhoW';i.parentNode.insertBefore(w,i);w.appendChild(i);const b=document.createElement('button');b.type='button';b.className='olhoB';b.title='Mostrar senha';b.innerHTML=OLHO;
 b.onclick=e=>{e.preventDefault();const ver=i.type==='password';i.type=ver?'text':'password';b.innerHTML=ver?OLHO_X:OLHO;b.title=ver?'Esconder senha':'Mostrar senha';i.focus()};w.appendChild(b)})}
new MutationObserver(olhoSenha).observe(document.documentElement,{childList:true,subtree:true});
</script>
